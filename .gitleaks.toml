# Config de gitleaks: sólo se relaja el falso secreto de los tests.
#
# El runner `secretos + dependencias` revisa TODO el historial. Los mocks
# HTTP de tests/test_gate_backend.py simulan un endpoint /api/token con
# `"access":"jwt-falso-123"`: las reglas de gitleaks lo leen como una
# credencial. Ese string ES el falso positivo (sólo vive en tests y su único
# "valor" es que lo consome el assertions del test), así que se deja fuera.

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos acotados a fixtures de tests"
# Se limita por ruta Y por contenido para no tapar nunca otra cosa.
paths = ['''tests/test_gate_backend\.py''']
regexes = ['''jwt-falso-123''']
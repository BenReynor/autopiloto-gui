# gitleaks config: only the tests' fake secret is relaxed.
#
# The `secretos + dependencias` runner reviews the WHOLE history. The HTTP
# mocks in tests/test_gate_backend.py simulate a /api/token endpoint with
# `"access":"jwt-falso-123"`: gitleaks rules read that as a credential.
# That string IS the false positive (it only lives in tests and its only
# "value" is that the test's assertion consumes it), so it is left out.

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos acotados a fixtures de tests"
# Limited by path AND by content so it never hides anything else.
paths = ['''tests/test_gate_backend\.py''']
regexes = ['''jwt-falso-123''']
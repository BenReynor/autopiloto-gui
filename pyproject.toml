[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dedalo"
version = "2.0.2"
description = "Panel de control de Dédalo: GUI PySide6 para gestionar agentes IA sobre proyectos"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.11.0",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
# `mcp` (servidor MCP por stdio) es opcional para el usuario, pero va también
# en `dev` para que la CI lo tenga y los tests de tests/test_mcp_server.py
# corran (hacen importorskip, así que sin él solo se saltan).
dev = [
    "pytest>=8",
    "ruff",
    "mcp>=2",
]
mcp = [
    "mcp>=2",
]

[tool.setuptools.packages.find]
include = ["dedalo*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
# Debe cubrir EXACTAMENTE lo que plantillas.py copia en runtime. Con
# `pip install -e .` los tests pasan igual, pero con `pip install .` un fichero
# ausente aquí provoca FileNotFoundError al agregar el primer proyecto.
# OJO: los globs `*` NO hacen match con ficheros que empiezan por punto, así
# que .gitignore necesita su propia entrada. Lo vigila
# tests/test_plantillas.py::test_package_data_cubre_lo_que_instala.
dedalo = [
    "plantillas_data/*.sh",
    "plantillas_data/*.md",
    "plantillas_data/.gitignore",
    "plantillas_data/gate_checks/*.sh",
    "plantillas_data/gate_checks/*.py",
    "icono.svg",
    "acceso.sh",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["dedalo/plantillas_data/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",          # largas; el código usa ~88 pero el label es descriptivo
    "B008",          # args mutables en selectores Qt (patrón de PySide)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
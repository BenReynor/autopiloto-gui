version: 2

updates:
  # Python dependencies (pyproject.toml). Dependabot opens PRs when new
  # versions come out; the CI runs on those PRs. The "Dependabot lock"
  # workflow regenerates requirements.lock on the same branch so the lock
  # check does not block the PR.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-deps:
        patterns: ["*"]

  # Versions of the GitHub Actions themselves (actions/checkout, setup-python…).
  # An incompatible change in an Action would break the CI; here it arrives as a PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

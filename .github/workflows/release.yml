name: Release

# Generates the release binaries when a v* tag is pushed.
#   git tag v2.1.0 && git push origin v2.1.0
# workflow_dispatch serves to test the pipeline without publishing (the
# release job only activates with a tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Weekly (Monday 07:00 UTC): compiles the 3 OSes even if there are no
  # changes, to detect that a runner/PyInstaller/PySide6 update breaks the
  # packaging. The `release` job is limited to tags, so this does NOT publish.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write  # creates the release and uploads artifacts

jobs:
  linux:
    name: Linux (tar.gz + .deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The binary boots Qt: besides the build libs, the runtime needs
      # GL/X/DBus (matches the .deb Depends).
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 dpkg-dev

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Empaquetar
        run: bash packaging/build_linux.sh

      - name: Checksums
        run: |
          cd packaging/out
          sha256sum *.tar.gz *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb
            packaging/out/*.AppImage
            packaging/out/SHA256SUMS
          if-no-files-found: error

  # Windows: the onedir (dedalo.exe) + .zip. The smoke validates the most
  # delicate part of the windowed binary: it boots the GUI and the engine via
  # `--dedalo-loop` runs packaged (its prints go to devnull, there is no
  # console) and returns its exit code.
  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    # Runner console = cp1252: the engine smoke writes ✗/→ and without
    # UTF-8 the exe would blow up with UnicodeEncodeError (the code already
    # protects itself, this is the build's second barrier).
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Empaquetar (smoke GUI + motor)
        shell: bash
        run: bash packaging/build_windows.sh

      - name: Checksums
        shell: bash
        run: |
          cd packaging/out
          sha256sum *.zip > SHA256SUMS-windows
          cat SHA256SUMS-windows

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            packaging/out/*.zip
            packaging/out/SHA256SUMS-windows
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    # Optional secrets: without them the .dmg ships unsigned (enough for
    # testing the pipeline). With them: codesign + notarytool + stapler.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Empaquetar (smoke + firma + .dmg + notarización)
        run: bash packaging/build_macos.sh

      - name: Checksums
        run: |
          cd packaging/out
          shasum -a 256 *.dmg > SHA256SUMS-macos
          cat SHA256SUMS-macos

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            packaging/out/*.dmg
            packaging/out/SHA256SUMS-macos
          if-no-files-found: error

  release:
    name: Crear release en GitHub
    needs: [linux, macos, windows]
    # Only when tagging a v*: workflow_dispatch publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for --generate-notes

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Dédalo $GITHUB_REF_NAME" \
            dist/*

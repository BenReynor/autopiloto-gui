name: Release

# Genera los binarios de la release cuando se etiqueta un tag v*.
#   git tag v2.1.0 && git push origin v2.1.0
# workflow_dispatch sirve para probar el pipeline sin publicar (el job de
# release sólo se activa con tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # crea la release y sube artefactos

jobs:
  linux:
    name: Linux (tar.gz + .deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # El binario arranca Qt: además de las libs de build, el runtime
      # necesita GL/X/DBus (coincide con los Depends del .deb).
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 dpkg-dev

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Empaquetar
        run: bash packaging/build_linux.sh

      - name: Checksums
        run: |
          cd packaging/out
          sha256sum *.tar.gz *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb
            packaging/out/*.AppImage
            packaging/out/SHA256SUMS
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    # Secretos opcionales: sin ellos el .dmg sale sin firmar (sirve para
    # probar el pipeline). Con ellos: codesign + notarytool + stapler.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Empaquetar (smoke + firma + .dmg + notarización)
        run: bash packaging/build_macos.sh

      - name: Checksums
        run: |
          cd packaging/out
          shasum -a 256 *.dmg > SHA256SUMS-macos
          cat SHA256SUMS-macos

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            packaging/out/*.dmg
            packaging/out/SHA256SUMS-macos
          if-no-files-found: error

  release:
    name: Crear release en GitHub
    needs: [linux, macos]
    # Sólo al etiquetar un v*: el workflow_dispatch no publica nada.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para --generate-notes

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Autopiloto $GITHUB_REF_NAME" \
            dist/*

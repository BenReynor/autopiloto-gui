name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Los tests hacen commits/reverts git REALES: sin identidad global,
      # `git commit` falla y los tests de revert/inicializar_git se rompen.
      - name: Identidad git
        run: |
          git config --global user.name "autopiloto CI"
          git config --global user.email "ci@autopiloto.local"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt en modo offscreen: sin pantalla, pero necesita estas libs nativas.
      - name: Dependencias del sistema (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check autopiloto_gui/ tests/

      - name: Tests (pytest headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/

  # Las plantillas shell se copian a proyectos de otros usuarios, que pueden
  # estar en macOS. Este job corre en BSD de verdad: lo que funciona aquí, sus
  # binutils/date/sed/find son los de macOS, y el lint es deliberadamente
  # ligero (sin importar el paquete). La suite completa en este SO la valida el
  # job "test-macos".
  portabilidad:
    name: portabilidad (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxis de las plantillas
        run: |
          # git ls-files incluye las de gate_checks y los lanzadores de la raíz.
          git ls-files '*.sh' | while read -r f; do
            echo "--- $f"
            bash -n "$f" || exit 1
          done

      - name: Lint de portabilidad
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          python -m ruff check tests/test_portabilidad.py
          # --noconftest: el conftest del repo importa PySide6, que aquí no
          # interesa (este test no abre ninguna ventana). Así el runner de
          # macOS no necesita Qt instalado.
          python -m pytest tests/test_portabilidad.py -q --noconftest

      - name: Sondeo de red con el ping de BSD
        # `ping -W` son segundos en GNU y milisegundos en BSD: si el flag se
        # colara mal, el runner de macOS se quedaría 2000 s colgado.
        run: |
          /usr/bin/time -p ping -c1 -W2000 8.8.8.8 || echo "sin red (esperado en CI)"

  # macOS: la suite completa, no sólo el lint de portabilidad. El miedo de
  # antes ("PySide6 no es fiable en ese runner") quedó obsoleto: la Release ya
  # arranca la GUI offscreen en macos-latest (build_macos.sh). Qt offscreen no
  # necesita deps extra en macOS y los .sh ya son portables a /bin/bash 3.2.
  # Este runner es arm64, la misma arquitectura del .dmg que publicamos.
  test-macos:
    name: ruff + pytest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Identidad git global (mismo motivo que en test/test-windows).
      - name: Identidad git
        run: |
          git config --global user.name "autopiloto CI"
          git config --global user.email "ci@autopiloto.local"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check autopiloto_gui/ tests/

      - name: Tests (pytest headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/

  # Windows: la GUI debe arrancar y la suite completa debe pasar con los
  # tests POSIX saltados (test_portabilidad, señales, 0600...). El loop es ya
  # un motor Python nativo (test_lanzador lo arranca por `python -m …loop`
  # desde otro cwd, como hace la GUI); el gate sigue siendo bash y funciona
  # porque el runner trae Git for Windows.
  test-windows:
    name: ruff + pytest (Windows)
    runs-on: windows-latest
    env:
      # Windows escribe tempfiles en cp1252 por defecto y la suite usa
      # emojis (✔ ✗ ≈): con la UTF-8 mode de Python todos los harness de
      # ficheros dejan de reventar. Los agentes reales de Windows escriben en
      # UTF-8, así que esto refleja el comportamiento de la app.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # Los tests hacen commits git REALES (mismo motivo que en test-linux).
      - name: Identidad git
        run: |
          git config --global user.name "autopiloto CI"
          git config --global user.email "ci@autopiloto.local"

      # El PATH de los runners de GitHub resuelve `bash` al shim de WSL, que
      # no es un bash POSIX (escupiría "Windows Subsystem for Linux has no
      # installed distributions"). Los harnesses de git/gate/motor lanzan
      # scripts con chmod 755 mediante `bash`, así que hay que poner el Git
      # Bash real delante.
      - name: Git Bash real en el PATH
        shell: pwsh
        run: |
          $git = "C:\Program Files\Git"
          "PATH=$git\bin;$git\usr\bin;$env:PATH" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check autopiloto_gui/ tests/

      - name: Tests (pytest headless)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: 1
        run: |
          set +e
          python -m pytest tests/
          rc=$?
          set -e
          if [ "$rc" -eq 134 ]; then
            echo "Ignoring SIGABRT (Qt teardown) exit code 134"
            exit 0
          fi
          exit $rc

  # El registro de proyectos guarda tokens de Telegram/WhatsApp/Discord en
  # claro y los agentes reciben GITHUB_TOKEN: si algo se cuela en el repo,
  # aquí se corta. Audita además los CVEs de las dependencias.
  seguridad:
    name: secretos + dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks revisa TODO el historial, no el diff

      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: El lock está al día con pyproject.toml
        # Se regenera in situ (el comentario de cabecera incluye la orden
        # exacta) y sólo se comprueba que git no vea diferencias.
        run: |
          uv pip compile --generate-hashes --extra dev --python-version 3.10 \
            -o requirements.lock pyproject.toml
          if ! git diff --quiet requirements.lock; then
            git diff requirements.lock
            echo "::error::requirements.lock desactualizado: reintenta con" \
              "'uv pip compile --generate-hashes --extra dev --python-version" \
              "3.10 -o requirements.lock pyproject.toml' y haz commit del lock"
            exit 1
          fi

      - name: Auditoría de dependencias (pip-audit sobre el lock)
        run: |
          # --strict: un CVE nuevo rompe el build en vez de imprimirse y
          # olvidarse. Las excepciones justificadas se anotan con
          # --ignore-vuln-id. --no-deps: el lock ya fija toda la cerradura.
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --strict